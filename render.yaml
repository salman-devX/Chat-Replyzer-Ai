services:
  - type: web
    name: chat-replyzer-ai
    env: node
    plan: starter
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: wa-sessions-disk
      mountPath: /app/server/wa_sessions
      sizeGB: 1
